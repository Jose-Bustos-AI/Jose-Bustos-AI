      <circle cx="1000" cy="320" r="190" fill="#0891b2"><animate attributeName="cx" values="1000;760;1000" dur="18s" repeatCount="indefinite"/><animate attributeName="cy" values="320;150;320" dur="15s" repeatCount="indefinite"/></circle>
