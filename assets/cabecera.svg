e="opacity" values="0;.9;0" dur="8s" begin="0.9s" repeatCount="indefinite"/></circle><circle cx="1160" cy="300" r="1.4" fill="#fb923c" opacity="0"><animate attributeName="cy" values="300;230" dur="7s" begin="3.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="7s" begin="3.6s" repeatCount="indefinite"/></circle><circle cx="40" cy="250" r="1.4" fill="#a855f7" opacity="0"><animate attributeName="cy" values="250;180" dur="9s" begin="4.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="9s" begin="4.2s" repeatCount="indefinite"/></circle><circle cx="610" cy="320" r="1.3" fill="#ec4899" opacity="0"><animate attributeName="cy" values="320;250" dur="6.8s" begin="4.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="6.8s" begin="4.8s" repeatCount="indefinite"/></circle><circle cx="960" cy="280" r="1.5" fill="#22d3ee" opacity="0"><animate attributeName="cy" values="280;210" dur="7.2s" begin="5.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="7.2s" begin="5.1s" repeatCount="indefinite"/></circle>
